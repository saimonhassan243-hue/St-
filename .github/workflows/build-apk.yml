name: Build Android APK & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Copy & Prepare APK Output
        run: |
          mkdir -p output
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/ssc-tracker.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/ssc-tracker.apk
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/ssc-tracker.apk
          else
            echo "Error: No APK file found in build outputs"
            exit 1
          fi
          ls -lh output/ssc-tracker.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssc-tracker-apk
          path: output/ssc-tracker.apk
          retention-days: 30

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SSC Prep & Tracker Release v1.0.${{ github.run_number }}"
          body: |
            ### 📱 SSC Prep & Routine Tracker - Production APK Release
            - **Build Number**: #${{ github.run_number }}
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`

            #### 📥 Direct Download
            Download the attached `ssc-tracker.apk` below and install it directly on your Android phone.
          files: output/ssc-tracker.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
