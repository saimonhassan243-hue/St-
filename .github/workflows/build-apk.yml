name: Build Android APK & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Copy & Prepare APK Output
        run: |
          mkdir -p output
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/ssc-tracker.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk output/ssc-tracker.apk
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output/ssc-tracker.apk
          else
            echo "Error: No APK file found in build outputs"
            exit 1
          fi
          ls -lh output/ssc-tracker.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssc-tracker-apk
          path: output/ssc-tracker.apk
          retention-days: 30

      - name: Install Google Drive Upload Dependencies
        run: pip install --upgrade google-api-python-client google-auth

      - name: Upload APK to Google Drive via Python
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          TARGET_FOLDER_ID: "1yQ4AKkNopspzEUpCYcuEci2KLl2mIhkF"
          FILE_PATH: "output/ssc-tracker.apk"
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import json
          import base64
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          raw_sa = os.environ.get('GDRIVE_SERVICE_ACCOUNT', '').strip()
          folder_id = os.environ.get('TARGET_FOLDER_ID', '').strip()
          file_path = os.environ.get('FILE_PATH', '').strip()

          if not raw_sa:
              print("Error: GDRIVE_SERVICE_ACCOUNT secret is missing or empty.")
              sys.exit(1)

          if not os.path.exists(file_path):
              print(f"Error: Target file not found at {file_path}")
              sys.exit(1)

          # Parse JSON (supports raw JSON string or base64 encoded JSON)
          try:
              if raw_sa.startswith('{'):
                  sa_info = json.loads(raw_sa)
              else:
                  sa_info = json.loads(base64.b64decode(raw_sa).decode('utf-8'))
          except Exception as e:
              print(f"Error parsing service account credentials JSON: {e}")
              sys.exit(1)

          scopes = ['https://www.googleapis.com/auth/drive']
          creds = service_account.Credentials.from_service_account_info(sa_info, scopes=scopes)
          drive_service = build('drive', 'v3', credentials=creds)

          file_name = os.path.basename(file_path)

          # Check if existing file exists in the destination folder to overwrite/update
          query = f"name = '{file_name}' and '{folder_id}' in parents and trashed = false"
          existing_files = drive_service.files().list(
              q=query,
              fields='files(id, name)',
              supportsAllDrives=True,
              includeItemsFromAllDrives=True
          ).execute().get('files', [])

          media = MediaFileUpload(file_path, mimetype='application/vnd.android.package-archive', resumable=True)

          if existing_files:
              existing_id = existing_files[0]['id']
              print(f"Overwriting existing file on Google Drive (File ID: {existing_id})...")
              updated_file = drive_service.files().update(
                  fileId=existing_id,
                  media_body=media,
                  fields='id, name, webViewLink',
                  supportsAllDrives=True
              ).execute()
              print(f"Successfully updated APK in Google Drive!")
              print(f"File ID: {updated_file.get('id')}")
              print(f"Link: {updated_file.get('webViewLink')}")
          else:
              print(f"Uploading new file to Google Drive folder '{folder_id}'...")
              file_metadata = {
                  'name': file_name,
                  'parents': [folder_id]
              }
              new_file = drive_service.files().create(
                  body=file_metadata,
                  media_body=media,
                  fields='id, name, webViewLink',
                  supportsAllDrives=True
              ).execute()
              print(f"Successfully uploaded APK to Google Drive!")
              print(f"File ID: {new_file.get('id')}")
              print(f"Link: {new_file.get('webViewLink')}")
          EOF
